<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Shield Shape Inner Glow -->
  <path
    d="M32 10 L49 17.5 V30 C49 41.5 41.5 50.5 32 54 C22.5 50.5 15 41.5 15 30 V17.5 Z"
    fill="url(#glowGrad)"
  />

  <!-- Shield Outline -->
  <path
    d="M32 10 L49 17.5 V30 C49 41.5 41.5 50.5 32 54 C22.5 50.5 15 41.5 15 30 V17.5 Z"
    fill="none"
    stroke="url(#borderGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Heartbeat / Auto-Scaling Telemetry Pulse -->
  <path
    d="M20 32 H25 L28 23 L32 41 L35 26 L38 32 H44"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Center Focal Signal Node -->
  <circle cx="32" cy="41" r="1.75" fill="#34d399" />
</svg>
